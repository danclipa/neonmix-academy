<!doctype html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b12">
    <meta name="description" content="NeonMix Academy — învață să mixezi prin lecții și exerciții practice.">
    <title>NeonMix Academy — Învață să mixezi</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #080b12;
            --card: #111722;
            --raised: #171f2d;
            --accent: #b8ff35;
            --blue: #62d7ff;
            --text: #f4f7fb;
            --muted: #929cad;
            --text-muted: var(--muted);
            --border: rgba(210,225,245,.13);
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            background:
                radial-gradient(ellipse at 82% -10%, rgba(184,255,53,.09), transparent 36rem),
                radial-gradient(ellipse at -10% 55%, rgba(67,119,255,.08), transparent 34rem),
                var(--bg);
            font-family: Inter, "Segoe UI", Tahoma, sans-serif;
            line-height: 1.55;
        }
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            min-height: 68px;
            padding: 12px max(20px, calc((100vw - 1060px) / 2));
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(8,11,18,.9);
            backdrop-filter: blur(16px);
        }
        .brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; }
        .brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; color: #090d12; background: var(--accent); font-size: 19px; font-weight: 900; }
        .brand-copy { display: grid; line-height: 1.1; }
        .brand-name { font-size: 14px; font-weight: 850; letter-spacing: .04em; }
        .brand-tag { margin-top: 4px; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .16em; }
        nav { display: flex; align-items: center; gap: 8px; }
        nav a, nav button { color: var(--text); font: inherit; font-size: 12px; text-decoration: none; }
        .container { width: min(1060px, 100%); margin: 0 auto; padding: 32px 22px 64px; }
        .site-footer { width:min(1060px,100%); margin:0 auto; padding:0 22px 24px; display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:12px; }
        .site-footer a { color:var(--blue); text-decoration:none; }
        .site-footer a:hover { text-decoration:underline; }
        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
            min-height: 40px;
            padding: 8px 13px;
            border: 1px solid transparent;
            border-radius: 10px;
            color: #101509;
            background: var(--accent);
            font: inherit;
            font-weight: 750;
            text-decoration: none;
            cursor: pointer;
        }
        .btn:hover { filter: brightness(1.06); }
        .btn-secondary { color: var(--text); background: rgba(255,255,255,.045); border-color: var(--border); }
        .btn:disabled { opacity: .48; cursor: not-allowed; }
        button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
        @media (max-width: 600px) {
            header { padding: 10px 14px; }
            .brand-tag { display: none; }
            nav { gap: 5px; }
            nav .btn { min-height: 36px; padding: 7px 9px; font-size: 11px; }
            .container { padding: 24px 14px 48px; }
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="brand" aria-label="NeonMix Academy">
            <span class="brand-mark" aria-hidden="true">♫</span>
            <span class="brand-copy"><span class="brand-name">NEONMIX</span><span class="brand-tag">ACADEMY · DJ SKILLS</span></span>
        </a>
        <nav aria-label="Navigare principală">
            <a class="btn btn-secondary" href="#acList">Lecții</a>
            <button class="btn" type="button" id="openWorkshopNav">Atelier practic</button>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <span>NeonMix Academy · Gratuită pentru toți</span>
        <a href="mailto:neonmixhub@gmail.com">Contact: neonmixhub@gmail.com</a>
    </footer>
</body>
</html>
